services:
  g1-sim:
    build: .
    container_name: g1_mujoco_sim
    network_mode: "host"
    tty: true
    stdin_open: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      - UV_LINK_MODE=copy
      - PATH=/root/.cargo/bin:/root/.local/bin:/usr/local/bin:/bin:/usr/bin:$PATH
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
